# Build and push the redfish-inventory-exporter image to GHCR when a v* tag is created.
# Image: ghcr.io/<owner>/redfish-inventory-exporter. A tag that contains -test gets no latest tag.

name: Build and Push Redfish Inventory Exporter Docker Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Publish
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive version and image tags
        id: meta
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          VERSION="${RAW_TAG#v}"
          TAG="${VERSION}"
          if [[ "$RAW_TAG" == *-test* ]]; then
            RELEASE_TYPE="testing"
          else
            RELEASE_TYPE="production"
          fi

          GHCR_IMAGE="${GHCR_REGISTRY}/${{ github.repository_owner }}/redfish-inventory-exporter"

          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE}:${TAG}"
            if [ "$RELEASE_TYPE" = "production" ]; then
              echo "${GHCR_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "RELEASE_TYPE=${RELEASE_TYPE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=${GHCR_IMAGE}" >> "$GITHUB_ENV"

          echo "GHCR image:   ${GHCR_IMAGE}:${TAG}"
          echo "Release Type: ${RELEASE_TYPE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=redfish-inventory-exporter
          cache-to: type=gha,mode=max,scope=redfish-inventory-exporter

      - name: Publish release summary
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "### Release: redfish-inventory-exporter" >> "$GITHUB_STEP_SUMMARY"
          echo "| Attribute | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`redfish-inventory-exporter\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Release Type** | \`${RELEASE_TYPE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **GHCR** | \`${GHCR_IMAGE}@${DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Git Commit** | \`${GITHUB_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
